name: CI

on:
  push:
    branches: ["xplearn/jescobedof"] # solo pushes a main
  pull_request:
    branches: ["xplearn/jescobedof"] # solo PRs hacia main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps (lockfile)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Ejecuta solo 1 test, 1 proyecto y sin reporte HTML
      - name: Run a single smoke test (Chromium only)
        run: npx playwright test tests/web/P0.spec.ts

      # Sube el reporte HTML si lo generaste en otra corrida o si más adelante decides habilitarlo
      - name: Upload artifacts (reports, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            playwright-report
            test-results
            artifacts
          retention-days: 1
