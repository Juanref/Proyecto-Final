name: CI

on:
  push:
    branches: ["xplearn/jescobedof"]
  pull_request:
    branches: ["xplearn/jescobedof"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # -------------------------
      # 1) Ejecutar pruebas Web
      # -------------------------
      - name: Run Web Tests (Playwright)
        run: npm run test:web

      # -------------------------
      # 2) Ejecutar pruebas API
      # -------------------------
      - name: Install Newman globally (required for tests)
        run: npm install -g newman newman-reporter-allure

      - name: Run API Tests (Newman)
        run: npm run test:apis

      # -------------------------
      # 3) Generar reporte Allure
      # -------------------------
      - name: Generate Allure Report
        run: npx allure generate ./allure-results --clean -o ./allure-report

      # -------------------------
      # 4) Subir artefactos
      # -------------------------
      - name: Upload artifacts (Playwright + Allure + API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            allure-report
            artifacts
          retention-days: 5
